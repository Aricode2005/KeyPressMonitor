name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Assemble and link
        shell: cmd
        run: |
          ml /c /coff KeyMonitor.asm
          link /subsystem:console KeyMonitor.obj kernel32.lib
